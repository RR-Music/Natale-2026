<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAATI 45 · SAATI Music</title>
<meta name="description" content="SAATI Music, edizione 45 giri, Natale 2026. Ascolta il lato A e il lato B.">
<meta property="og:title" content="SAATI 45 · SAATI Music">
<meta property="og:description" content="Edizione 45 giri, Natale 2026. Scegli il lato e premi Play.">
<meta property="og:image" content="copertina.jpg">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2317140F'/><circle cx='50' cy='50' r='20' fill='%23B8321E'/><circle cx='50' cy='50' r='4' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#17140F; --red:#B8321E; --grey:#5F5952; --idle:#736C64;
  --paper:#FAF8F4; --rule:#ECE6DC;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --L:min(520px, calc((100vh - 160px) / 1.3));
  --cover:calc(var(--L) * .54);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.02em}

/* ---------- Pagina desktop: una schermata ---------- */
.app{height:100vh;min-height:680px;display:flex;flex-direction:column;max-width:1320px;margin:0 auto;padding:0 40px}
.mast{display:flex;align-items:baseline;gap:24px;padding:22px 0 16px;border-bottom:1px solid var(--rule)}
.brand{font-family:var(--serif);font-weight:600;font-size:1.35rem;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;margin:0}
.brand::before{content:"";width:15px;height:15px;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 13%,var(--red) 14% 42%,var(--ink) 43%);flex:none;transform:translateY(1px)}
.mast .ed{color:var(--grey)}
.mast .cat{margin-left:auto;color:var(--grey)}
.mast .short{display:none}

main{flex:1;min-height:0;display:grid;padding:24px 0 24px;
  grid-template-columns:var(--cover) calc(var(--L) - var(--cover) - 20px) minmax(0,1fr);
  grid-template-rows:auto auto auto auto minmax(0,1fr);
  grid-template-areas:
    "cover colo sides"
    "cover colo info"
    "cover colo ctrl"
    "cover colo prog"
    "tt    tt   lyr";
  column-gap:20px;row-gap:14px}
.right{padding-left:36px}

/* Copertina */
.sleeve-block{grid-area:cover;position:relative;align-self:start}
.sleeve{position:relative;z-index:2;width:100%;aspect-ratio:1;box-shadow:0 1px 2px rgba(23,20,15,.12),0 10px 24px -12px rgba(23,20,15,.35)}
.sleeve img{width:100%;height:100%;object-fit:cover}
.mdisc-slot{display:none}

/* Colophon */
.colo{grid-area:colo;margin:0;align-self:start;display:grid;gap:12px;padding-top:2px}
.colo div{border-top:1px solid var(--rule);padding-top:7px}
.colo dt{font-family:var(--mono);font-size:.72rem;color:var(--grey)}
.colo dd{margin:1px 0 0;font-size:.95rem}

/* Giradischi */
.tt{grid-area:tt;align-self:end;width:var(--L)}
.tt svg{width:100%;height:auto;display:block;overflow:visible}
#disc{transform-box:view-box;transform-origin:190px 170px;animation:spin 1.333s linear infinite;animation-play-state:paused}
.playing #disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
#arm{transform-box:view-box;transform-origin:440px 56px;transition:transform .9s cubic-bezier(.3,.7,.3,1)}
#arm.track{transition:transform .35s linear}

/* Lati */
.sides{grid-area:sides;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sides button{height:48px;border:1px solid var(--ink);background:var(--bg);border-radius:3px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-family:var(--mono);font-weight:500;font-size:.9rem;letter-spacing:.06em;transition:background .15s,color .15s}
.sides button span{font-weight:400;color:var(--grey);letter-spacing:0}
.sides button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sides button[aria-pressed="true"] span{color:#cfc8bd}

/* Brano */
.info{grid-area:info;padding-top:6px}
.info .pos{color:var(--grey);margin:0}
.info h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,2.3vw,2.1rem);line-height:1.08;letter-spacing:-.015em;margin:4px 0 6px;font-variation-settings:"opsz" 96}
.info h1 small{font-style:italic;font-weight:400;font-size:.62em;color:var(--grey);letter-spacing:0}
.credits{margin:0;color:var(--grey);font-size:.9rem}
.credits:empty{display:none}

/* Comandi */
.ctrl{grid-area:ctrl;display:flex;align-items:center;gap:14px}
.skip{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--bg);font-family:var(--mono);font-size:.72rem;display:grid;place-items:center}
.skip:hover{border-color:var(--ink)}
.play{width:62px;height:62px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 #7d2012;transition:transform .08s,box-shadow .08s}
.play:active{transform:translateY(2px);box-shadow:0 1px 0 #7d2012}
.play svg{width:24px;height:24px}
.play .i-pause,.playing .play .i-play{display:none}
.playing .play .i-pause{display:block}
.status{color:var(--grey);margin-left:4px;min-width:0}
.sleeve.missing{background:var(--paper);border:1px dashed #C9C2B6;box-shadow:none;display:grid;place-items:center;text-align:center;padding:12px}
.sleeve.missing img{display:none}
.sleeve .miss{display:none;font-family:var(--mono);font-size:.72rem;color:var(--grey)}
.sleeve.missing .miss{display:block}
.status.err{color:var(--red)}
.flip{display:none;border:0;background:none;padding:0;font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--red);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.ended .flip{display:inline}
.ended .status{display:none}

/* Avanzamento */
.prog{grid-area:prog;display:flex;align-items:center;gap:12px;color:var(--grey);font-variant-numeric:tabular-nums}
.seek{flex:1;-webkit-appearance:none;appearance:none;height:24px;background:transparent;margin:0;--p:0%}
.seek::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,var(--ink) var(--p),var(--rule) var(--p))}
.seek::-moz-range-track{height:3px;background:var(--rule)}
.seek::-moz-range-progress{height:3px;background:var(--ink)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);margin-top:-5px;border:0}
.seek::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ink);border:0}

/* Testo sincronizzato */
.lyr.right{padding-left:0;margin-left:36px}
.lyr{grid-area:lyr;min-height:0;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule);border-radius:4px;margin-top:6px}
.scroller{flex:1;min-height:0;overflow-y:auto;position:relative;padding:0 26px;overscroll-behavior:contain;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.scroller.scrolled{-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.scroller::-webkit-scrollbar{display:none}
.lines{padding:22px 0 var(--half,120px)}
.ln{margin:0;padding:5px 0 5px 18px;position:relative;color:var(--idle);font-size:1.02rem;line-height:1.35;cursor:pointer;transition:color .2s,font-size .2s}
.ln.note{font-family:var(--serif);font-style:italic;font-size:.95rem}
.ln.on{color:var(--ink);font-weight:650;font-size:1.22rem}
.ln.on::before{content:"";position:absolute;left:0;top:calc(5px + .675em - 4px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.ln.on.note{font-weight:500}
.ln .ts{display:none}

/* Strumento di sincronizzazione (?sync) */
.syncbar{display:none;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule)}
.sync .syncbar{display:flex}
.syncbar p{margin:0;flex:1 1 100%;color:var(--grey);font-size:.85rem}
.syncbar button{border:1px solid var(--ink);background:var(--bg);border-radius:3px;padding:7px 12px;font-family:var(--mono);font-size:.78rem}
.syncbar .mark{background:var(--ink);color:#fff;flex:1}
.sync .ln .ts{display:inline-block;width:5.2em;margin-left:-.2em;font-family:var(--mono);font-size:.72rem;color:var(--grey);font-weight:400}
.sync .ln.next{color:var(--ink);font-weight:650}
.sync .ln.next::before{content:"";position:absolute;left:0;top:calc(5px + .675em - 4px);width:8px;height:8px;border-radius:50%;border:2px solid var(--red)}
.sync .scroller{-webkit-mask-image:none;mask-image:none}

/* ---------- Smartphone: disco dalla busta ---------- */
@media (max-width:760px){
  :root{--cv:clamp(104px,min(calc((100vw - 36px - 12px - 124px) / 1.34),24vh),180px)} /* copertina: lascia a destra almeno 124px per titolo e pulsanti */
  .app{height:auto;min-height:0;padding:0 18px}
  .mast{padding:14px 0 10px}
  .mast .brand,.mast .ed,.mast .cat{display:none}
  .mast .short{display:block;color:var(--ink)}
  .mast .short b{font-family:var(--serif);font-weight:600;font-size:1rem;font-family:var(--serif)}
  /* blocco alto: busta+disco a sinistra, titolo+lati a destra, stessa altezza */
  main{display:grid;padding:16px 0 28px;column-gap:12px;row-gap:12px;
    grid-template-columns:calc(var(--cv) * 1.34) minmax(0,1fr);
    grid-template-rows:auto 1fr auto auto auto auto;
    grid-template-areas:
      "cover info"
      "cover sides"
      "ctrl  ctrl"
      "prog  prog"
      "lyr   lyr"
      "colo  colo"}
  .right{padding-left:0}
  .lyr.right{margin-left:0}
  .tt{display:none}
  .sleeve-block{width:var(--cv);align-self:start}
  .mdisc-slot{display:block;position:absolute;z-index:1;top:calc(var(--cv) * .026);left:calc(var(--cv) * .042);width:calc(var(--cv) * .947);height:calc(var(--cv) * .947);
    transform:translateX(calc(var(--cv) * .116));transition:transform .6s cubic-bezier(.3,.7,.3,1)}
  .out .mdisc-slot{transform:translateX(calc(var(--cv) * .347))}
  .mdisc{width:100%;height:100%;border-radius:50%;position:relative;
    background:repeating-radial-gradient(circle,#24201b 0 .8px,#17140F .8px 2.2px);
    box-shadow:0 6px 14px -6px rgba(23,20,15,.5);
    animation:spin 1.333s linear infinite;animation-play-state:paused}
  .playing .mdisc{animation-play-state:running}
  .mdisc .lbl{position:absolute;inset:26%;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:calc(var(--cv) * .11)}
  .mdisc .lbl::after{content:"";position:absolute;inset:40%;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--ink) inset}
  .mdisc .lbl span{position:absolute;top:10%}
  .mdisc::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 12%,rgba(255,255,255,.12) 16%,transparent 22% 62%,rgba(255,255,255,.08) 66%,transparent 72%)}
  .info{padding-top:0;min-width:0;align-self:start}
  .info .pos{font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info h1{font-size:clamp(1.1rem,4.8vw,1.5rem);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .credits{display:none} /* su mobile non c'è spazio: interpreti e autori allungherebbero il blocco */
  .sides{grid-template-columns:1fr;gap:8px;align-self:end}
  /* i due pulsanti si dividono l'altezza rimasta, così il blocco destro finisce esattamente al fondo della busta */
  .sides button{height:clamp(30px,calc((var(--cv) - 66px) / 2),46px);padding:0 12px;font-size:.82rem}
  .ctrl{margin-top:4px}
  .skip,.play{flex:none} /* non si deformano se il messaggio di stato è lungo */
  .prog{margin-top:-6px}
  .lyr{height:276px;margin-top:0}
  .colo{padding-top:28px;grid-template-columns:1fr 1fr;gap:12px 18px}
  .scroller{padding:0 18px}
  .ln{font-size:.98rem}
  .ln.on{font-size:1.1rem}
}
@media (prefers-reduced-motion:reduce){
  #disc,.mdisc{animation:none}
  #arm,#arm.track,.mdisc-slot,.ln{transition:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="mast">
    <p class="brand">SAATI Music</p>

  </header>

  <main>
    <div class="sleeve-block">
      <div class="mdisc-slot" aria-hidden="true"><div class="mdisc"><div class="lbl"><span class="mside">A</span></div></div></div>

      <button class="skip" type="button" id="fwd" data-i18n-label="fwd">+10</button>

        <!-- piatto -->

        <circle cx="190" cy="170" r="147" fill="#C8C3BB"/>
        <g stroke="#BAB5AD" stroke-width="1" fill="none">

<script>
/* ============ Contenuti: modifica qui ============ */
const CONFIG = {
  per: "tutta la famiglia SAATI",   // lascia "" per nascondere
  da:  "Renato Russo",               // lascia "" per nascondere
  formato: "Singolo 7\" · 45 giri",
  catalogo: "SM45-001",
  sides: {
    A: { brano:"A1", titolo:"SAATI Day", sottotitolo:"", interpreti:"", autori:"", audio:"lato-a.mp3", lrc:"lato-a.lrc" },
    B: { brano:"B1", titolo:"Santa Claude", sottotitolo:"", interpreti:"", autori:"", audio:"lato-b.mp3", lrc:"lato-b.lrc" }
  }

/* ============ Utilità ============ */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const fmt = s => !isFinite(s) || s < 0 ? "0:00" : `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const lrcTime = s => `[${String(Math.floor(s/60)).padStart(2,"0")}:${(s%60).toFixed(2).padStart(5,"0")}]`;

function parseLRC(txt){
  const out = [], m = {};
  for (const raw of txt.split(/\r?\n/)) {
    const tag = raw.match(/^\[(ti|ar|al|by|au|length):(.*)\]\s*$/i);
    if (tag) { m[tag[1].toLowerCase()] = tag[2].trim(); continue; }
    const stamps = [...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
    if (!stamps.length) continue;
    const text = raw.replace(/\[[^\]]*\]/g, "").trim();
    for (const s of stamps) out.push({ t: +s[1]*60 + parseFloat(s[2].replace(":", ".")), text });
  }
  out.sort((a,b) => a.t - b.t);
  return { lines: out.filter((l,i) => l.text || i === 0), meta: m };
}

async function getLRC(s){
  if (lrcCache[s]) return lrcCache[s];
  let txt = LRC_FALLBACK[s];
  try { const r = await fetch(CONFIG.sides[s].lrc, { cache:"no-cache" }); if (r.ok) txt = await r.text(); } catch(e) {}
  return (lrcCache[s] = txt);
}

/* ============ Testo ============ */
function renderLines(){
  linesEl.innerHTML = lines.map((l,i) => {
    const note = l.text.startsWith("♪");
    const txt = note ? (l.text.replace(/^♪\s*/,"") || "♪") : l.text;
    return `<p class="ln${note ? " note" : ""}" data-i="${i}"><span class="ts">${SYNC && l.stamped === false ? "" : fmt(l.t) + "." + String(Math.floor((l.t%1)*10))}</span>${esc(txt)}</p>`;
  }).join("");
  active = -1;
  sizePanel();
  highlight(true);
}

function sizePanel(){
  if (isMobile()) {
    const top = $("lyr").getBoundingClientRect().top + scrollY;
    const h = Math.max(200, Math.min(460, innerHeight - top - 14));
    $("lyr").style.height = h + "px";
  } else $("lyr").style.height = "";
  linesEl.style.setProperty("--half", Math.round(scroller.clientHeight / 2) + "px");
}

function centerOn(el, instant){
  if (!el || Date.now() < userScrollUntil) return;
  const top = el.offsetTop + el.offsetHeight / 2 - scroller.clientHeight / 2;
  scroller.scrollTo({ top, behavior: instant || REDUCE.matches ? "auto" : "smooth" });
}

function highlight(instant){
  if (SYNC) return syncHighlight(instant);
  const t = audio.currentTime || 0;
  let i = -1;
  for (let k = 0; k < lines.length; k++) { if (lines[k].t <= t + 0.05) i = k; else break; }
  if (i === active && !instant) return;
  const els = linesEl.children;
  if (els[active]) els[active].classList.remove("on");
  active = i;
  if (els[i]) els[i].classList.add("on");
  centerOn(els[Math.max(i,0)], instant);
}

scroller.addEventListener("scroll", () => scroller.classList.toggle("scrolled", scroller.scrollTop > 8), { passive:true });
["wheel","touchstart"].forEach(ev => scroller.addEventListener(ev, () => userScrollUntil = Date.now() + 3000, { passive:true }));
linesEl.addEventListener("click", e => {
  const p = e.target.closest(".ln"); if (!p || SYNC) return;
  userScrollUntil = 0; audio.currentTime = lines[+p.dataset.i].t; highlight();
});

/* ============ Lato e brano ============ */
async function loadSide(s){
  side = s;
  const c = CONFIG.sides[s];
  audio.src = c.audio;
  audio.load();
  app.classList.remove("ended", "out");
  $("pos").textContent = `${T.side} ${s} · ${c.brano}`;
  $("title").innerHTML = esc(c.titolo) + (c.sottotitolo ? ` <small>${esc(c.sottotitolo)}</small>` : "");
  $("credits").innerHTML = [[T.perf,c.interpreti],[T.auth,c.autori]].filter(([,v]) => v).map(([k,v]) => `${k}: ${esc(v)}`).join("<br>");
  $("labelSide").textContent = s;
  $("labelText").textContent = `SAATI MUSIC · ${CONFIG.catalogo} · ${T.side.toUpperCase()} ${s} · 45 ·`;
  document.querySelector(".mside").textContent = s;
  document.querySelectorAll(".sides button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.side === s)));
  $("flip").textContent = T.flip + (s === "A" ? "B" : "A");
  $("syncHelp").textContent = T.syncHelp.replace("{s}", s);
  setStatus(T.ready);
  setProgress();
  setArm("rest");
  const parsed = parseLRC(await getLRC(s));
  if (side !== s) return;
  meta = parsed.meta;
  lines = parsed.lines;
  if (SYNC) lines.forEach((l,i) => l.stamped = i === 0);
  renderLines();
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({
    title: c.titolo, artist: c.interpreti || "SAATI Music", album: `SAATI 45 · ${CONFIG.catalogo}`,
    artwork: [{ src:"copertina.jpg", sizes:"1400x1400", type:"image/jpeg" }]
  });
}

function setSide(s){
  if (s === side) return;
  const wasPlaying = !audio.paused;
  audio.pause();
  loadSide(s).then(() => { if (wasPlaying) play(); });
}

/* ============ Braccio (desktop) ============ */
const P = { x:440, y:56 }, C = { x:190, y:170 }, ARM = 232, R_EDGE = 98, R_END = 52;
function angleFor(r){
  for (let a = 0; a < 80; a += 0.05) {
    const rad = a * Math.PI / 180, x = P.x - ARM * Math.sin(rad), y = P.y + ARM * Math.cos(rad);
    if (Math.hypot(x - C.x, y - C.y) <= r) return a;
  }
  return 40;
}
const A_EDGE = angleFor(R_EDGE), A_END = angleFor(R_END);
const arm = document.getElementById("arm");
let armState = "rest";
function setArm(state){
  armState = state;
  if (state === "rest") { arm.classList.remove("track"); arm.style.transform = "rotate(0deg)"; return; }
  const p = audio.duration ? Math.min(1, audio.currentTime / audio.duration) : 0;
  const a = A_EDGE + (A_END - A_EDGE) * p;
  arm.style.transform = `rotate(${a.toFixed(2)}deg)`;
}
function dropArm(){
  arm.classList.remove("track");
  setArm("on");
  setTimeout(() => { if (armState === "on") arm.classList.add("track"); }, 950);
}

function setStatus(s, err){ $("status").textContent = s; $("status").classList.toggle("err", !!err); }

function setProgress(){

document.addEventListener("keydown", e => {
  if (e.target.closest("input, button") && e.code !== "Space") return;

  if (SYNC && e.code === "Backspace") { e.preventDefault(); undo(); return; }
  if (e.target.closest("button")) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }

/* ============ Strumento «tocca a ogni riga» (index.html?sync) ============ */
function nextIndex(){ return lines.findIndex(l => !l.stamped); }
function syncHighlight(instant){
  const n = nextIndex(), els = linesEl.children;
  [...els].forEach((el,i) => {
    el.classList.toggle("next", i === n);
    el.querySelector(".ts").textContent = lines[i].stamped ? lrcTime(lines[i].t).slice(1,-1) : "";
  });
  if (n !== active) { active = n; centerOn(els[n === -1 ? els.length - 1 : n], instant); }
}
function mark(){
  const n = nextIndex(); if (n === -1) return;
  lines[n].t = audio.currentTime; lines[n].stamped = true; active = -2; syncHighlight();
}
function undo(){
  let n = nextIndex(); n = n === -1 ? lines.length - 1 : n - 1;
  if (n > 0) { lines[n].stamped = false; active = -2; syncHighlight(); }
}
function saveLRC(){
  const head = [`[ti:${meta.ti || CONFIG.sides[side].titolo}]`, `[ar:${meta.ar || "SAATI Music"}]`, `[by:sincronizzato a mano]`];
  const body = lines.filter(l => l.stamped).map(l => lrcTime(l.t) + l.text);
  const blob = new Blob([head.concat(body).join("\n") + "\n"], { type:"text/plain;charset=utf-8" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: CONFIG.sides[side].lrc });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
if (SYNC) {
  app.classList.add("sync");
  $("mark").addEventListener("click", mark);
  $("undo").addEventListener("click", undo);
  $("restart").addEventListener("click", () => { audio.pause(); audio.currentTime = 0; lines.forEach((l,i) => l.stamped = i === 0); active = -2; syncHighlight(true); });
  $("save").addEventListener("click", saveLRC);
}

/* ============ Avvio ============ */
addEventListener("resize", () => { sizePanel(); highlight(true); });
loadSide("A");
</script>
